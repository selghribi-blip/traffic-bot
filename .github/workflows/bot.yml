name: Traffic Bot Runner

on:
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch:
    inputs:
      target_url:
        description: 'Override target URL'
        required: false
        default: ''
      run_mode:
        description: 'Run mode'
        required: false
        default: 'both'
        type: choice
        options: [both, scrapy, browserstack, local]
      use_browserstack:
        description: 'Use BrowserStack'
        required: false
        default: 'true'

permissions:
  actions: write
  contents: read

jobs:
  # ============================================================
  # 1) SCRAPY SPIDER — Manual only
  # ============================================================
  run-scrapy-spider:
    name: Run Scrapy Spider (Manual)
    if: |
      github.event.inputs.run_mode == 'both' ||
      github.event.inputs.run_mode == 'scrapy'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python deps
        run: |
          pip install --upgrade pip
          pip install --no-cache-dir 'Twisted==25.5.0' 'w3lib==2.3.1' 'PySocks>=1.7.1'
          pip install --no-cache-dir -r requirements.txt
          echo "=== Installed versions ==="
          pip show Twisted w3lib scrapy PySocks | grep -E "Name|Version"

      - name: Verify dependencies
        run: |
          python -c "import twisted; print('Twisted:', twisted.__version__)"
          python -c "from twisted.internet._sslverify import _setAcceptableProtocols; print('✅ SSL protocols OK')"
          python -c "from w3lib.url import _safe_chars; print('✅ w3lib OK')"
          python -c "import socks; print('✅ PySocks:', socks.__version__)"
          python -c "import scrapy; print('✅ Scrapy:', scrapy.__version__)"

      - name: Debug env
        env:
          TARGET_URL: ${{ github.event.inputs.target_url || vars.TARGET_URL || 'https://www.forjo.tech/' }}
        run: |
          echo "TARGET_URL: $TARGET_URL"
          echo "MONGODB set: ${{ secrets.MONGODB_URI != '' }}"
          echo "Manual proxies:"
          wc -l manual_proxies.txt 2>/dev/null || echo "not found"

      - name: Run Scrapy spider
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          TARGET_URL: ${{ github.event.inputs.target_url || vars.TARGET_URL || 'https://www.forjo.tech/' }}
          MANUAL_PROXY_FILE: 'manual_proxies.txt'
          PROXY_HEALTHCHECK: 'false'
          DISABLE_PROXIES: 'false'
          FETCH_REMOTE_PROXIES: 'true'
        run: |
          scrapy crawl traffic_bot \
            -a target_url="${TARGET_URL}" \
            -O scrapy_results.json \
            -L INFO

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scrapy-results
          path: scrapy_results.json
          if-no-files-found: ignore
          retention-days: 7

  # ============================================================
  # 2) BROWSERSTACK SPIDER — Auto + Manual
  # ============================================================
  run-browserstack-spider:
    name: Run BrowserStack Spider
    if: |
      github.event_name == 'schedule' ||
      github.event.inputs.run_mode == 'both' ||
      github.event.inputs.run_mode == 'browserstack'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python deps
        run: |
          pip install --upgrade pip
          pip install --no-cache-dir 'Twisted==25.5.0' 'w3lib==2.3.1' 'PySocks>=1.7.1'
          pip install --no-cache-dir -r requirements.txt

      - name: Verify dependencies
        run: |
          python -c "from twisted.internet._sslverify import _setAcceptableProtocols; print('✅ SSL OK')"
          python -c "import socks; print('✅ PySocks OK')"

      - name: Run BrowserStack spider
        env:
          BROWSERSTACK_USERNAME: ${{ secrets.BROWSERSTACK_USERNAME }}
          BROWSERSTACK_ACCESS_KEY: ${{ secrets.BROWSERSTACK_ACCESS_KEY }}
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          TARGET_URL: ${{ github.event.inputs.target_url || vars.TARGET_URL || 'https://www.forjo.tech/' }}
          USE_BROWSERSTACK: ${{ github.event.inputs.use_browserstack || 'true' }}
        run: |
          scrapy crawl browserstack_bot \
            -a target_url="${TARGET_URL}" \
            -a use_browserstack="${USE_BROWSERSTACK}" \
            -O browserstack_results.json \
            -L INFO

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browserstack-results
          path: browserstack_results.json
          if-no-files-found: ignore
          retention-days: 7

  # ============================================================
  # 3) LOCAL BROWSER SPIDER — Auto + Manual
  # ============================================================
  run-local-browser-spider:
    name: Run Local Browser Spider
    if: |
      github.event_name == 'schedule' ||
      github.event.inputs.run_mode == 'both' ||
      github.event.inputs.run_mode == 'local'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Chrome + ChromeDriver (matched versions)
        run: |
          sudo apt-get update
          sudo apt-get install -y wget unzip xvfb
          CHROME_VERSION="131.0.6778.87"
          wget -q "https://storage.googleapis.com/chrome-for-testing-public/${CHROME_VERSION}/linux64/chrome-linux64.zip"
          wget -q "https://storage.googleapis.com/chrome-for-testing-public/${CHROME_VERSION}/linux64/chromedriver-linux64.zip"
          unzip -q chrome-linux64.zip
          unzip -q chromedriver-linux64.zip
          sudo mv chrome-linux64 /opt/chrome
          sudo mv chromedriver-linux64/chromedriver /usr/local/bin/chromedriver
          sudo chmod +x /usr/local/bin/chromedriver
          sudo ln -sf /opt/chrome/chrome /usr/local/bin/google-chrome
          /usr/local/bin/google-chrome --version
          /usr/local/bin/chromedriver --version

      - name: Install Python deps
        run: |
          pip install --upgrade pip
          pip install --no-cache-dir 'Twisted==25.5.0' 'w3lib==2.3.1' 'PySocks>=1.7.1'
          pip install --no-cache-dir -r requirements.txt

      - name: Run Local Browser spider
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          TARGET_URL: ${{ github.event.inputs.target_url || vars.TARGET_URL || 'https://www.forjo.tech/' }}
          CHROME_BIN: '/usr/local/bin/google-chrome'
          CHROMEDRIVER_PATH: '/usr/local/bin/chromedriver'
        run: |
          xvfb-run -a scrapy crawl browserstack_bot \
            -a target_url="${TARGET_URL}" \
            -a use_browserstack="false" \
            -O local_results.json \
            -L INFO

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: local-results
          path: local_results.json
          if-no-files-found: ignore
          retention-days: 7

  # ============================================================
  # 4) AGGREGATE RESULTS
  # ============================================================
  aggregate-results:
    name: Aggregate Results
    needs: [run-scrapy-spider, run-browserstack-spider, run-local-browser-spider]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install pymongo
        run: pip install pymongo

      - name: Aggregate and summarize
        run: |
          echo "=== TRAFFIC BOT RUN SUMMARY ==="
          echo "Run ID: ${{ github.run_id }}"
          echo "Run Number: ${{ github.run_number }}"
          echo "Trigger: ${{ github.event_name }}"
          echo ""

          cat << 'PYEOF' > aggregate.py
          import sys, json
          try:
              content = sys.stdin.read().strip()
              if not content:
                  data = []
              elif content.startswith('['):
                  data = json.loads(content)
              else:
                  data = [json.loads(line) for line in content.split('\n') if line.strip()]
              visits = [d for d in data if d.get('type') in ['visit', 'browserstack_visit']]
              ad_clicks = [d for d in data if d.get('type') == 'ad_click']
              form_submits = [d for d in data if d.get('type') == 'form_submit']
              total_visits = len(visits)
              total_ads = sum(v.get('ads_clicked', 0) for v in visits) + len(ad_clicks)
              total_forms = sum(v.get('forms_filled', 0) for v in visits) + len(form_submits)
              print(f'Visits: {total_visits}')
              print(f'Ads Clicked: {total_ads}')
              print(f'Forms Filled: {total_forms}')
              print(f'Status: {visits[0].get("status", "N/A") if visits else "N/A"}')
          except Exception as e:
              print(f"Notice: {e}")
          PYEOF

          for file in artifacts/*/*.json; do
            if [ -f "$file" ]; then
              echo "--- $(basename $file) ---"
              cat "$file" | python3 aggregate.py
            fi
          done

      - name: Fail if all results empty
        run: |
          total=$(python3 - <<'PYEOF'
          import json, glob
          total = 0
          for f in glob.glob('artifacts/*/*.json'):
              try:
                  with open(f) as fh:
                      c = fh.read().strip()
                      if not c: continue
                      data = json.loads(c) if c.startswith('[') else [json.loads(l) for l in c.split('\n') if l.strip()]
                      total += len(data)
              except Exception:
                  pass
          print(total)
          PYEOF
          )
          echo "TOTAL ITEMS: $total"
          if [ "$total" -eq 0 ]; then
            echo "::error::No items produced in this run"
            exit 1
          fi

      - name: Send summary to MongoDB
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
        run: |
          cat << 'PYEOF' > mongo_log.py
          import os, json, glob
          from pymongo import MongoClient
          from datetime import datetime, timezone
          uri = os.getenv('MONGODB_URI', '').strip()
          if not uri:
              print("MongoDB: empty URI, skipping")
              raise SystemExit(0)
          try:
              client = MongoClient(uri, serverSelectionTimeoutMS=5000)
              db = client['traffic_bot']
              sessions = db['sessions']
              total_visits = total_ads = total_forms = 0
              for f in glob.glob('artifacts/*/*.json'):
                  try:
                      with open(f) as fh:
                          c = fh.read().strip()
                          if not c: continue
                          data = json.loads(c) if c.startswith('[') else [json.loads(l) for l in c.split('\n') if l.strip()]
                          for d in data:
                              if d.get('type') in ['visit', 'browserstack_visit']:
                                  total_visits += 1
                                  total_ads += d.get('ads_clicked', 0)
                                  total_forms += d.get('forms_filled', 0)
                  except Exception:
                      pass
              sessions.insert_one({
                  'run_id': '${{ github.run_id }}',
                  'run_number': ${{ github.run_number }},
                  'trigger': '${{ github.event_name }}',
                  'timestamp': datetime.now(timezone.utc),
                  'total_visits': total_visits,
                  'total_ads_clicked': total_ads,
                  'total_forms_filled': total_forms,
                  'status': 'completed' if total_visits else 'empty',
              })
              print(f"Logged: {total_visits} visits, {total_ads} ads, {total_forms} forms")
          except Exception as e:
              print(f"MongoDB Notice: {e}")
          PYEOF
          python3 mongo_log.py

  # ============================================================
  # 5) CLEANUP
  # ============================================================
  cleanup:
    name: Cleanup Old Runs
    runs-on: ubuntu-latest
    if: always()
    steps:
      - uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ github.token }}
          repository: ${{ github.repository }}
          retain_days: 7
          keep_minimum_runs: 10
